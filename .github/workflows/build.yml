name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: mvn -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: CdrShopEconomy-1.0.0-beta.2
          path: target/CdrShopEconomy-*.jar
          if-no-files-found: error
